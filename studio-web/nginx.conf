# Docker's embedded DNS. Resolving upstreams per request (via variables) lets
# nginx start even when a backend container is not up yet.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;

    client_max_body_size 30m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/identity/ {
        set $upstream http://identity:8081;
        rewrite ^/api/identity/(.*)$ /$1 break;
        proxy_pass $upstream;
    }

    location /api/assets/ {
        set $upstream http://assets:8082;
        rewrite ^/api/assets/(.*)$ /$1 break;
        proxy_pass $upstream;
    }

    location /api/renditions/ {
        set $upstream http://renditions:8083;
        rewrite ^/api/renditions/(.*)$ /$1 break;
        proxy_pass $upstream;
    }

    # Review serves Server-Sent Events: no buffering, long read timeout.
    location /api/review/ {
        set $upstream http://review:8084;
        rewrite ^/api/review/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        chunked_transfer_encoding on;
    }

    location /api/brand/ {
        set $upstream http://brand-check:8085;
        rewrite ^/api/brand/(.*)$ /$1 break;
        proxy_pass $upstream;
    }

    location /api/campaigns/ {
        set $upstream http://campaigns:8086;
        rewrite ^/api/campaigns/(.*)$ /$1 break;
        proxy_pass $upstream;
    }

    location /api/rights/ {
        set $upstream http://rights:8087;
        rewrite ^/api/rights/(.*)$ /$1 break;
        proxy_pass $upstream;
    }

    location /static/ {
        # Hashed build output.
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
