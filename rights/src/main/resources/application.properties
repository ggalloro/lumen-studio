spring.application.name=rights
server.port=${PORT:8087}

lumen.data-dir=${DATA_DIR:./data}
lumen.token-secret=${TOKEN_SECRET:dev-secret-change-me}
lumen.internal-token=${INTERNAL_TOKEN:dev-internal-token}
lumen.assets-url=${ASSETS_URL:http://localhost:8082}
lumen.assets.connect-timeout-ms=2000
lumen.assets.socket-timeout-ms=5000

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.default-property-inclusion=always
spring.jackson.serialization.write-dates-as-timestamps=false

# Unknown routes go through the exception handler so they return {"error": ...} as well.
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

server.error.include-message=never
server.error.include-stacktrace=never

logging.level.studio.lumen.rights=INFO
