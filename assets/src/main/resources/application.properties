spring.application.name=assets
server.port=${PORT:8082}

lumen.data-dir=${DATA_DIR:./data}
lumen.token-secret=${TOKEN_SECRET:dev-secret-change-me}
lumen.internal-token=${INTERNAL_TOKEN:dev-internal-token}
lumen.renditions-url=${RENDITIONS_URL:http://localhost:8083}
lumen.self-url=${ASSETS_SELF_URL:http://localhost:8082}

# Uploads are capped at 25 MB; the request limit leaves room for the other form fields.
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=26MB
# Let Tomcat read oversized bodies so the client gets a JSON error instead of a reset connection.
server.tomcat.max-swallow-size=-1

spring.sql.init.mode=always
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.default-property-inclusion=always
spring.mvc.problemdetails.enabled=false
